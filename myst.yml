version: 1
extends:
  - content/authors.yml
project:
  title: "Event Cognition and Emotional Arousal in Autobiographical Memory"
  subtitle: A Synthesis of Literatures from Event Cognition, Emotional Memory, and Autobiographical Memory
  description: >
    A critical review of how the stream of experience is transformed into autobiographical 
    memory. The review evaluates cognitive, affective, computational, and neural evidence
    and integrates social, developmental, and narrative accounts of memory. It develops 
    future research directions for laboratory and naturalistic approaches, with implications for
    storytelling, meaning-making, narrative identity, and emotion regulation.
  keywords:
    - event cognition
    - affective neuroscience
    - cognitive neuroscience
    - causal cognition 
    - autobiographical memory
    - narrative
    - meaning-making
    - emotion regulation
    - naturalistic neuroscience
    - multimodal recording
    - intracranial EEG
    - naturalistic memory
  license: MIT
  open_access: true
  numbering:
    figure:
      continue: true
    table:
      continue: true
    equation:
      continue: true
    code:
      continue: true
  plugins:
    - https://github.com/AllenNeuralDynamics/AuthorshipExtractor/releases/latest/download/authorship-plugin.mjs
    - plugins/evidence-explorer-plugin.mjs
    - plugins/figure-lightbox-plugin.mjs
  github: https://github.com/atasevac/Event-Cognition-and-Emotional-Arousal-in-Autobiographical-Memory
  bibliography:
    - content/references.bib
  toc:
    - file: content/00_frontmatter.md
    - file: content/01_introduction.md
    - file: content/Methods.md
      title: Methods
    - file: content/evidence_database.md
      title: Evidence Database
    - file: content/provenance.md
      title: Pipeline Provenance
  exports:
    - format: tex
      output: review_manuscript.tex
      template: ./latex/template
    - format: pdf
      output: review_manuscript.pdf
      template: ./latex/template
site:
  template: book-theme
  title: "Event Cognition and Emotional Arousal in Autobiographical Memory"
  nav:
    - title: GitHub
      url: https://github.com/atasevac/Event-Cognition-and-Emotional-Arousal-in-Autobiographical-Memory
